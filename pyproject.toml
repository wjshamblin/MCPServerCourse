[project]
name = "mcp-server-course"
version = "0.1.0"
description = "MCP Server Course - Building MCP Servers with FastMCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp[azure]>=2.14.0",
    # Required by azure-identity's async credentials (e.g. OnBehalfOfCredential
    # used by EntraOBOToken). azure-core declares aiohttp as an optional dep
    # for its async transport, so without this the first OBO call raises
    # `ImportError: aiohttp package is not installed` at runtime.
    "aiohttp>=3.9.0",
    "uvicorn>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.uv]
dev-dependencies = []
